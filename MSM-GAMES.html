<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSM-GAMES</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe id="gorunum"></iframe>

    <script>
        // RAW URL, MSM-GAMES deposuna göre güncellendi
        const RAW_URL = "https://raw.githubusercontent.com/blatzz92/MSM-GAMES/main/index.html";

        function koduGetir() {
            const iframe = document.getElementById("gorunum");
            
            // Önbelleği önlemek için timestamp ekleniyor
            fetch(`${RAW_URL}?t=${Date.now()}`)
                .then(response => {
                    if (!response.ok) throw new Error("Ağ yanıtı başarısız.");
                    return response.text();
                })
                .then(htmlContent => {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    doc.open();
                    doc.write(htmlContent);
                    doc.close();

                    // Siyah ekran / boş kalma durumuna karşı kontrol
                    siyahEkranKontrolu(iframe);
                })
                .catch(error => {
                    console.error("Kod yüklenirken hata oluştu, yeniden deneniyor...", error);
                    // Hata durumunda 3 saniye sonra tekrar dene
                    setTimeout(koduGetir, 3000);
                });
        }

        function siyahEkranKontrolu(iframe) {
            // Sayfa yüklendikten 10 saniye sonra içerik kontrol edilir, 
            // boş veya siyah ekranda kalırsa otomatik olarak baştan yüklenir.
            setTimeout(() => {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!iframeDoc.body || iframeDoc.body.innerHTML.trim() === "") {
                        console.log("Siyah ekran algılandı, otomatik yenileniyor...");
                        koduGetir();
                    }
                } catch (e) {
                    // Güvenlik kısıtlamaları (CORS) takibi için yedek mekanizma
                }
            }, 10000);
        }

        window.addEventListener("DOMContentLoaded", koduGetir);
    </script>

</body>
</html>
