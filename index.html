<!DOCTYPE html>
<html lang="tr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="MSM-GAMES oyun kütüphanesi">
  <title>MSM-GAMES</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    :root{color-scheme:dark;--bg:#080b16;--surface:#12182b;--line:rgba(177,194,255,.16);--text:#f4f6ff;--muted:#9aa6c4;--accent:#73e1ff}
    *{box-sizing:border-box}html{min-width:320px;scroll-behavior:smooth}body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(ellipse at 14% 0%,rgba(70,91,190,.22),transparent 38%),radial-gradient(ellipse at 92% 18%,rgba(0,198,218,.12),transparent 32%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}.topbar{position:sticky;z-index:5;top:0;border-bottom:1px solid var(--line);background:rgba(8,11,22,.88);backdrop-filter:blur(18px)}.topbar-inner{width:min(1120px,calc(100% - 40px));min-height:70px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;font-weight:850;letter-spacing:.07em}.brand img{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--surface);cursor:pointer}.brand span{font-size:1rem}.header-actions{display:flex;align-items:center;gap:10px}.lang-select,.info-button{padding:10px 13px;color:var(--text);border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer}.info-button:hover,.lang-select:focus-visible,.info-button:focus-visible{border-color:var(--accent);outline:2px solid rgba(115,225,255,.25)}main{width:min(1120px,calc(100% - 40px));margin:auto;padding:36px 0 52px}.library-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.library-title{margin:0;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.04em}.count{margin-left:9px;color:var(--muted);font-size:.9rem;font-weight:500}.search-wrap{position:relative;width:min(330px,45%)}.search-icon{position:absolute;top:50%;left:14px;color:var(--muted);transform:translateY(-50%);pointer-events:none}.search{width:100%;padding:12px 14px 12px 40px;color:var(--text);border:1px solid var(--line);border-radius:12px;outline:none;background:rgba(19,26,46,.8)}.search::placeholder{color:#7885a4}.search:focus{border-color:rgba(115,225,255,.6);box-shadow:0 0 0 4px rgba(115,225,255,.08)}.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:17px}.game-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:rgba(18,24,43,.86);transition:transform .2s,border-color .2s,box-shadow .2s}.game-card:hover{transform:translateY(-4px);border-color:rgba(115,225,255,.44);box-shadow:0 18px 38px rgba(0,0,0,.24)}.game-art{display:grid;aspect-ratio:16/10;overflow:hidden;place-items:center;background:linear-gradient(145deg,#1a2540,#101626)}.game-art img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.game-card:hover .game-art img{transform:scale(1.04)}.fallback{color:var(--accent);font-size:2.5rem;font-weight:800}.game-body{padding:16px}.game-title{min-height:2.8em;margin:0 0 13px;overflow-wrap:anywhere;font-size:1.04rem;line-height:1.4}.play-button{display:flex;min-height:42px;align-items:center;justify-content:center;padding:10px;border:0;border-radius:10px;color:#07121c;background:linear-gradient(105deg,#80e8ff,#a9d8ff);text-decoration:none;font-size:.9rem;font-weight:800}.status{grid-column:1/-1;padding:42px 18px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:16px;line-height:1.7}.status strong{display:block;margin-bottom:5px;color:var(--text)}.status button{margin-top:12px;padding:9px 14px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:var(--surface);cursor:pointer}.info-section{margin-top:48px;padding:23px;border:1px solid var(--line);border-radius:16px;background:rgba(18,24,43,.7);scroll-margin-top:94px}.info-heading{margin:0 0 8px;font-size:1.25rem}.info-description{margin:0 0 19px;color:var(--muted);line-height:1.65}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.info-item{padding:13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025)}.info-label{display:block;margin-bottom:5px;color:var(--muted);font-size:.78rem}.info-value{font-weight:650;overflow-wrap:anywhere}.info-error{color:#ffaa8a}footer{padding:20px;color:var(--muted);text-align:center;border-top:1px solid var(--line);font-size:.83rem}
    .splash{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,#17233c 0%,#090d19 68%);transition:opacity .5s,visibility .5s}.splash.hidden{visibility:hidden;opacity:0;pointer-events:none}.splash-inner{display:flex;width:min(380px,100%);flex-direction:column;align-items:center;gap:20px;text-align:center;animation:intro .7s both}.splash-logo-wrap{display:grid;width:154px;height:154px;place-items:center;border:1px solid rgba(115,225,255,.2);border-radius:38px;background:rgba(255,255,255,.035);box-shadow:0 0 70px rgba(115,225,255,.13);animation:float 3s ease-in-out infinite}.splash-logo{width:78%;height:78%;object-fit:contain;border-radius:23px;cursor:pointer}.splash-name{margin:0;font-size:1.8rem;font-weight:850;letter-spacing:.12em}.continue{min-width:200px;padding:14px 22px;color:#07121c;border:0;border-radius:12px;background:linear-gradient(105deg,#80e8ff,#b5a2ff);box-shadow:0 10px 35px rgba(91,179,255,.2);cursor:pointer;font-weight:850}.continue:hover{transform:translateY(-2px)}.continue:focus-visible{outline:3px solid white;outline-offset:3px}.site-content[hidden]{display:none}@keyframes intro{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-7px)}}
    @media(max-width:620px){.topbar-inner,main{width:calc(100% - 30px)}.topbar-inner{min-height:64px}.brand img{width:35px;height:35px}.brand span{font-size:.88rem}.header-actions{gap:7px}.lang-select,.info-button{padding:9px 10px;font-size:.87rem}main{padding-top:27px}.library-head{align-items:stretch;flex-direction:column;gap:14px}.search-wrap{width:100%}.game-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}.info-section{margin-top:34px;padding:18px}}
    @media(max-width:390px){.game-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <section class="splash" id="splash" aria-label="MSM-GAMES"><div class="splash-inner"><div class="splash-logo-wrap"><img class="splash-logo" data-site-logo src="icon.png" alt="MSM-GAMES"></div><p class="splash-name">MSM-GAMES</p><button class="continue" id="continue-button" type="button" data-i18n="continue">DEVAM ET</button></div></section>

  <div class="site-content" id="site-content" hidden>
    <header class="topbar"><div class="topbar-inner"><a class="brand" href="#home" aria-label="MSM-GAMES"><img data-site-logo src="icon.png" alt=""><span>MSM-GAMES</span></a><div class="header-actions"></div></div></header>
    <main id="home"><section aria-labelledby="games-title"><div class="library-head"><h1 class="library-title" id="games-title" data-i18n="gamesTitle">Oyunlar<span class="count" id="game-count"></span></h1><label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input class="search" id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="Oyun ara..."></label></div><div class="game-grid" id="game-grid" aria-live="polite"></div></section>
      <section class="info-section" id="info-section" aria-labelledby="info-title"><h2 class="info-heading" id="info-title" data-i18n="infoTitle">Bilgi</h2><p class="info-description" id="info-description" data-i18n="infoLoading">Bilgiler yükleniyor…</p><div class="info-grid" id="info-grid"></div></section>
    </main><footer data-i18n="footer">© 2026 MSM-GAMES</footer>
  </div>

  <script>
    (()=>{
      'use strict';
      const OWNER='blatzz92',REPO='MSM-GAMES',BRANCH='main';
      const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
      const PAGES='https://blatzz92.github.io/MSM-GAMES';
      const SECRET_GAME=`${PAGES}/games/e-s/gizli-oyun.html`;
      const strings={
        tr:{continue:'DEVAM ET',gamesTitle:'Oyunlar',searchPlaceholder:'Oyun ara...',loading:'Oyunlar yükleniyor…',emptyTitle:'Henüz oyun yok',emptyText:'Games klasöründe gösterilecek bir HTML oyunu bulunamadı.',noResults:'Aramana uygun oyun bulunamadı.',errorTitle:'Oyunlar yüklenemedi',errorText:'İnternet bağlantını kontrol edip yeniden deneyebilirsin.',retry:'Yeniden dene',play:'Oyna',infoTitle:'Bilgi',infoLoading:'Bilgiler yükleniyor…',infoError:'Bilgiler şu anda yüklenemedi.',version:'Sürüm',engine:'Oyun motoru',developers:'Geliştiriciler',footer:'© 2026 MSM-GAMES. Tüm hakları saklıdır.',count:n=>`${n} oyun`},
        en:{continue:'CONTINUE',gamesTitle:'Games',searchPlaceholder:'Search games...',loading:'Loading games…',emptyTitle:'No games yet',emptyText:'No HTML games were found in the games folder.',noResults:'No games match your search.',errorTitle:'Could not load games',errorText:'Check your connection and try again.',retry:'Try again',play:'Play',infoTitle:'Information',infoLoading:'Loading information…',infoError:'Information could not be loaded right now.',version:'Version',engine:'Game engine',developers:'Developers',footer:'© 2026 MSM-GAMES. All rights reserved.',count:n=>`${n} games`}
      };
      const splash=document.getElementById('splash'),site=document.getElementById('site-content');
      const grid=document.getElementById('game-grid'),search=document.getElementById('search'),count=document.getElementById('game-count');
      let lang='tr',games=[],started=false;
      function setLanguage(next){lang=next==='en'?'en':'tr';document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(x=>{const val=strings[lang][x.dataset.i18n];if(val)x.textContent=val;});document.querySelectorAll('[data-i18n-placeholder]').forEach(x=>{x.placeholder=strings[lang][x.dataset.i18nPlaceholder]||'';});if(started){if(games.length)renderGames();loadInfo();}}
      function showStatus(title,message,retry){grid.replaceChildren();const box=document.createElement('div');box.className='status';const strong=document.createElement('strong');strong.textContent=title;const detail=document.createElement('span');detail.textContent=message;box.append(strong,detail);if(retry){const button=document.createElement('button');button.type='button';button.textContent=strings[lang].retry;button.addEventListener('click',loadGames);box.append(button);}grid.append(box);}
      async function loadLogo(){try{const response=await fetch(`${API}/contents/icon.png`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('Logo API error');const file=await response.json();document.querySelectorAll('[data-site-logo]').forEach(img=>img.src=file.download_url||`${PAGES}/icon.png`);}catch(error){console.warn('Could not load logo from GitHub API.',error);}}
      async function loadGames(){showStatus(strings[lang].loading,'',false);try{const response=await fetch(`${API}/contents/games?ref=${BRANCH}`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error(`GitHub API ${response.status}`);const files=await response.json();if(!Array.isArray(files))throw Error('Unexpected GitHub API response');const images=new Map(files.filter(f=>f.type==='file'&&/\.png$/i.test(f.name)).map(f=>[f.name.replace(/\.png$/i,'').toLocaleLowerCase(),f.download_url]));games=files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name)).map(f=>{const stem=f.name.replace(/\.html$/i,'');const path=f.path.split('/').map(encodeURIComponent).join('/');return{title:stem.replace(/[-_]+/g,' ').trim(),url:`${PAGES}/${path}?lang=${lang}`,image:images.get(stem.toLocaleLowerCase())||''};}).sort((a,b)=>a.title.localeCompare(b.title,lang==='tr'?'tr':'en'));renderGames();}catch(error){console.error('Could not load games.',error);games=[];showStatus(strings[lang].errorTitle,strings[lang].errorText,true);}}
      function renderGames(){const locale=lang==='tr'?'tr-TR':'en-US',query=search.value.trim().toLocaleLowerCase(locale),filtered=games.filter(game=>game.title.toLocaleLowerCase(locale).includes(query));count.textContent=games.length?` · ${strings[lang].count(games.length)}`:'';grid.replaceChildren();if(!games.length){showStatus(strings[lang].emptyTitle,strings[lang].emptyText,false);return;}if(!filtered.length){showStatus(strings[lang].noResults,'',false);return;}const fragment=document.createDocumentFragment();filtered.forEach(game=>{const card=document.createElement('article');card.className='game-card';const art=document.createElement('div');art.className='game-art';if(game.image){const img=document.createElement('img');img.src=game.image;img.alt=`${game.title} icon`;img.loading='lazy';img.onerror=()=>{img.remove();addFallback(art,game.title);};art.append(img);}else addFallback(art,game.title);const body=document.createElement('div');body.className='game-body';const title=document.createElement('h2');title.className='game-title';title.textContent=game.title;const play=document.createElement('a');play.className='play-button';play.href=`${game.url}?lang=${lang}`;play.target='_blank';play.rel='noopener noreferrer';play.textContent=strings[lang].play;body.append(title,play);card.append(art,body);fragment.append(card);});grid.append(fragment);}
      function addFallback(container,title){const fallback=document.createElement('span');fallback.className='fallback';fallback.setAttribute('aria-hidden','true');fallback.textContent=title.slice(0,1).toUpperCase();container.append(fallback);}
      async function loadInfo(){const description=document.getElementById('info-description'),container=document.getElementById('info-grid');container.replaceChildren();description.textContent=strings[lang].infoLoading;try{const response=await fetch(`${PAGES}/data/settings.json`,{cache:'no-store'});if(!response.ok)throw Error(`Settings HTTP ${response.status}`);const settings=await response.json();const data=settings[lang]||settings.tr||settings;if(!data||typeof data!=='object')throw Error('Invalid settings');document.getElementById('info-title').textContent=data.title||strings[lang].infoTitle;description.textContent=data.description||'';const developers=Array.isArray(data.developers)?data.developers.join(', '):data.developers;const items=[[strings[lang].version,data.version],[strings[lang].engine,data.engine],[strings[lang].developers,developers]];items.forEach(([label,value])=>{if(value===undefined||value===null||value==='')return;const item=document.createElement('div');item.className='info-item';const name=document.createElement('span');name.className='info-label';name.textContent=label;const content=document.createElement('span');content.className='info-value';content.textContent=String(value);item.append(name,content);container.append(item);});}catch(error){console.error('Could not load data/settings.json.',error);description.textContent=strings[lang].infoError;description.classList.add('info-error');}}
      let logoClicks=0;document.querySelectorAll('[data-site-logo]').forEach(logo=>logo.addEventListener('click',event=>{event.preventDefault();logoClicks++;if(logoClicks>=25)window.location.href=`${SECRET_GAME}?lang=${lang}`;}));
      document.getElementById('continue-button').addEventListener('click',()=>{if(started)return;started=true;splash.classList.add('hidden');site.hidden=false;loadGames();loadInfo();});
      search.addEventListener('input',renderGames);
      setLanguage(lang);loadLogo();
    })();
  </script>
</body>
</html>
